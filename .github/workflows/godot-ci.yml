# This workflow will build a Godot .NET project
# For more information see: https://github.com/marketplace/actions/build-godot

name: "godot-ci export"
on:
  pull_request:
  push:
    branches: 
      - develop

env:
  GODOT_VERSION: 4.4
  EXPORT_NAME: "starswarm-develop"
  PROJECT_PATH: .
  BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
  ITCH_PROJECT_NAME: "star-swarm"
  ITCH_USERNAME: "capnbootyberry"

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-22.04
    container:
      image: adrasteondev/godot-ci:mono-4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          ls
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/$EXPORT_NAME.exe"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows
  push-to-itch:
    needs: export-windows
    if: ${{ contains(github.ref, 'develop') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Exports
        uses: actions/download-artifact@v4
        with:
          name: exports
          path: exports
      - name: Zip Exports
        run: |
          cd exports/windows
          zip -r starswarm.zip $EXPORT_NAME.exe $EXPORT_NAME.pck
          cd ../..
      - name: Download + Authorize Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V
      - name: Login To Butler
        run: ./butler login
      - name: Push Windows Export To Itch
        run: ./butler push exports/windows/starswarm.zip $ITCH_USERNAME/$ITCH_PROJECT_NAME:win
